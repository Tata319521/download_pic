<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>image_download</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <canvas id="particle-canvas"></canvas>

  <main class="page">
    <section class="hero glass-card fade-up">
      <div class="card-glow"></div>

      <div class="hero-content">
        <div>
          <div class="eyebrow">IMAGE DOWNLOAD · HIGH RESOLUTION</div>
          <h1>图片下载</h1>
        </div>

        <div class="hero-mark">DOWNLOAD</div>
      </div>
    </section>

    <section class="toolbar fade-up delay">
      <div class="toolbar-text">
        共 3 张高清图片
      </div>

      <button class="main-btn" onclick="downloadAllImages()">
        下载全部图片
      </button>
    </section>

    <section class="gallery fade-up delay">
      <article class="image-card">
        <div class="image-frame">
          <img src="./images/pic1.jpg" alt="高清图片 01" />
          <span class="image-number">NO.01</span>
        </div>

        <div class="image-info">
          <h2>格式模板1</h2>
          <a class="download-btn" href="./images/pic1.jpg" download="image-01.jpg">
            下载
          </a>
        </div>
      </article>

      <article class="image-card">
        <div class="image-frame">
          <img src="./images/pic2.jpg" alt="高清图片 02" />
          <span class="image-number">NO.02</span>
        </div>

        <div class="image-info">
          <h2>格式模板2</h2>
          <a class="download-btn" href="./images/pic2.jpg" download="image-02.jpg">
            下载
          </a>
        </div>
      </article>

      <article class="image-card">
        <div class="image-frame">
          <img src="./images/pic3.jpg" alt="高清图片 03" />
          <span class="image-number">NO.03</span>
        </div>

        <div class="image-info">
          <h2>格式模板3</h2>
          <a class="download-btn" href="./images/pic3.jpg" download="image-03.jpg">
            下载
          </a>
        </div>
      </article>
    </section>

    <footer class="footer">
      IMAGE DOWNLOAD SITE
    </footer>
  </main>

  <script src="./script.js"></script>
</body>
</html>
